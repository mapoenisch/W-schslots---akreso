name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Node-Abhängigkeiten installieren
        run: npm ci

      - name: Debug-Keystore für den Test-Build erzeugen
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Gradle aus der Projektkonfiguration herunterladen
        shell: bash
        run: |
          GRADLE_URL="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\//g')"
          echo "Lade Gradle herunter: $GRADLE_URL"
          curl --fail --location --silent --show-error "$GRADLE_URL" --output gradle.zip
          unzip -q gradle.zip
          GRADLE_BIN="$(find . -maxdepth 3 -type f -path './gradle-*/bin/gradle' | head -n 1)"
          test -n "$GRADLE_BIN"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

      - name: Debug-APK bauen
        run: "$GRADLE_BIN --no-daemon assembleDebug"

      - name: Test-APK speichern
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error